<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Galaxy Strike: Legacy</title>
    <meta name="description" content="Classic 90s space shooter reimagined. Shoot, survive, and dominate the galaxy." />

    <!-- PWA / Home Screen -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#020818" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS Standalone / Home Screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Galaxy Strike" />
    <link rel="apple-touch-icon" href="/icon.svg" />

    <!-- Prevent tap highlight on mobile -->
    <meta name="format-detection" content="telephone=no" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />

    <!-- Open Graph -->
    <meta property="og:title" content="Galaxy Strike: Legacy" />
    <meta property="og:description" content="Classic 90s space shooter reimagined for today's smartphones." />
    <meta property="og:type" content="website" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <style>
      /* Prevent flash of white before React mounts */
      html, body { background: #020818; margin: 0; padding: 0; }
      /* Block iOS bounce/overscroll */
      body { overscroll-behavior: none; touch-action: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register service worker for offline / PWA install
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
