kind = "web"
previewPath = "/"
title = "Galaxy Strike: Legacy"
version = "1.0.0"
id = "artifacts/galaxy-strike"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20436

[services.development]
run = "pnpm --filter @workspace/galaxy-strike run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/galaxy-strike", "run", "build" ]
serve = "static"
publicDir = "artifacts/galaxy-strike/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20436"
BASE_PATH = "/"
